<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東進過去問一括ダウンローダー</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; background: #f4f6f8; }
        .card { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; margin-top: 20px; padding: 12px; background: #007aff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; }
        button:disabled { background: #999; }
        #status { margin-top: 15px; text-align: center; font-size: 14px; color: #666; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>東進過去問 DL</h2>
        
        <!-- ステップ1: ログイン情報入力 -->
        <form id="step1Form">
            <label>ログインID (メールアドレス)</label>
            <input type="text" id="userId" required>

            <label>パスワード</label>
            <input type="password" id="password" required>

            <button type="submit" id="step1Btn">送信 ➔ 2段階認証へ</button>
        </form>

        <!-- ステップ2: 認証コード ＆ 検索情報入力 -->
        <form id="step2Form" class="hidden">
            <div id="otpSection">
                <label>2段階認証コード（メール等で届いたコード）</label>
                <input type="text" id="otpCode" placeholder="123456">
            </div>

            <label>大学名</label>
            <input type="text" id="university" placeholder="例: 東京大学" required>

            <label>教科名</label>
            <input type="text" id="subject" placeholder="例: 数学">

            <button type="submit" id="step2Btn">一括ダウンロード (ZIP)</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        let currentSessionId = '';

        // ステップ1フォーム送信
        document.getElementById('step1Form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('step1Btn');
            const status = document.getElementById('status');

            btn.disabled = true;
            status.innerText = '東進にアクセス中...';

            try {
                const res = await fetch('/api/login-step1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: document.getElementById('userId').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                currentSessionId = data.sessionId;

                document.getElementById('step1Form').classList.add('hidden');
                document.getElementById('step2Form').classList.remove('hidden');

                if (data.requiresOtp) {
                    status.innerText = 'メール等に届いた2段階認証コードを入力してください。';
                } else {
                    document.getElementById('otpSection').classList.add('hidden');
                    status.innerText = 'ログイン完了！大学名を入力してダウンロードしてください。';
                }

            } catch (err) {
                status.innerText = 'エラー: ' + err.message;
                btn.disabled = false;
            }
        });

        // ステップ2フォーム送信
        document.getElementById('step2Form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('step2Btn');
            const status = document.getElementById('status');

            btn.disabled = true;
            status.innerText = 'PDFを取得・ZIP化しています... (1〜2分かかります)';

            try {
                const res = await fetch('/api/download-step2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: currentSessionId,
                        otpCode: document.getElementById('otpCode').value,
                        university: document.getElementById('university').value,
                        subject: document.getElementById('subject').value
                    })
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.error);
                }

                const blob = await res.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `${document.getElementById('university').value}_過去問.zip`;
                document.body.appendChild(a);
                a.click();
                a.remove();

                status.innerText = 'ダウンロードが完了しました！';

            } catch (err) {
                status.innerText = 'エラー: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
